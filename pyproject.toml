# pyproject.toml
[project]
name = "tta"
version = "0.1.0"
description = "Through the Ages AI self-play strategy research tool"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tta = "tta.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tta"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
